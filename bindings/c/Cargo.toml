[package]
name = "paimon-c"
description = "C bindings for Apache Paimon Rust"

repository.workspace = true
edition.workspace = true
license.workspace = true
version.workspace = true

[lib]
crate-type = ["cdylib", "staticlib"]
doc = false

[features]
# storage-hdfs (services-hdfs-native, pure Rust) is on by default for paimon-c
# since bleem builds always read from HDFS. storage-hdfs-jni is opt-in: it
# pulls in libhdfs + JNI, used together with alluxio-client.jar to reach
# Alluxio via the Hadoop FileSystem SPI. See `docs/alluxio-via-libhdfs-impl-plan.md`.
default = ["storage-hdfs"]
storage-hdfs = ["paimon/storage-hdfs"]
storage-hdfs-jni = ["paimon/storage-hdfs-jni"]

[dependencies]
paimon = { path = "../../crates/paimon", default-features = false, features = ["storage-memory", "storage-fs", "storage-oss"] }
tokio = { workspace = true, features = ["rt-multi-thread"] }
futures = "0.3"
arrow-array = { workspace = true }

[build-dependencies]
# Auto-generates include/paimon.h from the Rust extern "C" surface on every
# build. Pinned at 0.27 (last version supporting Rust 1.86).
cbindgen = "0.27"

[dev-dependencies]
tempfile = "3"
