# Configuration for cbindgen — generates `include/paimon.h` from the Rust
# source. Regenerate with `cbindgen --config cbindgen.toml --crate paimon-c
# --output include/paimon.h` from this directory, or rely on build.rs.

language = "C"
include_guard = "PAIMON_C_H"
pragma_once = true
cpp_compat = true
documentation = true
documentation_style = "doxy"
style = "type"
no_includes = false
sys_includes = []
header = """\
/*
 * Licensed to the Apache Software Foundation (ASF) under one or more
 * contributor license agreements. See the NOTICE file distributed with
 * this work for additional information regarding copyright ownership.
 * The ASF licenses this file to you under the Apache License, Version 2.0
 * (the "License"); you may not use this file except in compliance with
 * the License. You may obtain a copy of the License at
 *
 *   http://www.apache.org/licenses/LICENSE-2.0
 */

/* Auto-generated by cbindgen. Do not edit by hand. */"""

[parse]
# Only parse this crate. Without this, cbindgen tries to walk every public
# type in `paimon`, `arrow-array`, etc. and the header explodes.
parse_deps = false

[export]
# Rust enum `PaimonErrorCode` keeps its CamelCase name; rename to match the
# `paimon_*` lowercase convention used by everything else in this crate.
[export.rename]
#"PaimonErrorCode" = "paimon_error_code"

[enum]
# C enums lack a stable repr; force a typedef'd `int32_t`-backed enum so the
# layout matches `#[repr(i32)]` on the Rust side.
#prefix_with_name = true
#rename_variants = "ScreamingSnakeCase"

[fn]
# No prefix/postfix — function names are already explicit on the Rust side.
prefix = ""
postfix = ""
