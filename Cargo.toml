[workspace]
resolver = "2"
members = ["crates/paimon", "crates/paimon-rest-server", "crates/integration_tests", "bindings/c", "bindings/python", "crates/integrations/datafusion"]

[workspace.package]
version = "0.3.0"
edition = "2021"
homepage = "https://paimon.apache.org/docs/rust/"
repository = "https://github.com/apache/paimon-rust"
license = "Apache-2.0"
rust-version = "1.86.0"

[workspace.dependencies]
arrow = "58.0"
arrow-array = { version = "58.0", features = ["ffi"] }
arrow-arith = "58.0"
arrow-buffer = "58.0"
arrow-schema = "58.0"
arrow-cast = "58.0"
arrow-ord = "58.0"
arrow-row = "58.0"
arrow-select = "58.0"
arrow-string = "58.0"
datafusion = "53.0.0"
datafusion-ffi = "53.0.0"
paimon = { version = "0.3.0", path = "crates/paimon" }
parquet = "58.0"
constant_time_eq = ">=0.4.0, <0.5.1"
tokio = "1.39.2"
tokio-util = "0.7"

# Override the crates.io hdfs-native (pulled in transitively via opendal's
# services-hdfs-native feature) with Kuaishou's internal fork. [patch] only
# takes effect from the workspace root.
#
# The URL is https so online build servers can fetch it with their token/CI
# credentials. Local developers who only have ssh access should rewrite it via
# global git config (cargo fetches under ~/.cargo/git, so it must be --global):
#   git config --global url."ssh://git@git.corp.kuaishou.com/".insteadOf \
#                          "https://git.corp.kuaishou.com/"
# Both paths also need net.git-fetch-with-cli = true (see .cargo/config.toml).
[patch.crates-io]
hdfs-native = { git = "https://git.corp.kuaishou.com/ks-dataarc/kwailake/hdfs-native.git", rev = "5e2d2a8e" }
